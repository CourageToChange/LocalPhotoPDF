name: Bug report
description: Something in LocalPhotoPDF does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not report security vulnerabilities here.** Use the private route in
        [SECURITY.md](../blob/main/SECURITY.md) instead, so the problem can be fixed before it
        is public.

        **Never attach a photo that you would not want to be public.** Issues are visible to
        everyone. If a specific image causes the problem, describe it instead: format, rough size and
        pixel dimensions. Please don't upload it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
      placeholder: I added 12 photos and pressed Generate PDF. The app showed an error saying...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What should someone do, in order, to see the same thing?
      placeholder: |
        1. Open LocalPhotoPDF
        2. Drag in 12 JPEGs from a phone camera
        3. Set page size to A4 and quality to Balanced
        4. Press Generate PDF
        5. See the error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LocalPhotoPDF version
      description: It is in the filename you downloaded, or right-click LocalPhotoPDF.exe -> Properties -> Details.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: How did you install it?
      options:
        - Installer (LocalPhotoPDF-Setup-...exe)
        - Portable ZIP
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Press Win+R, type `winver`, and copy what it says."
      placeholder: Windows 11 24H2 (build 26100.1234)
    validations:
      required: true

  - type: textarea
    id: photos
    attributes:
      label: What kind of photos were involved?
      description: >
        Format (JPEG, PNG, HEIC, TIFF...), roughly how many, roughly how large, and where they came
        from: phone, camera, screenshots, scans. HEIC, WebP, AVIF and RAW rely on codecs supplied
        by Windows, so this often matters.
      placeholder: About 40 HEIC photos straight off an iPhone, 3-4 MB each.

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Error messages, a screenshot of the app (not of your photos), or anything else you think might help.
