name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write
  # The CodeQL action reads its own workflow run to attach results to it. Without this the
  # analysis completes, exports SARIF, and then dies on the upload with "Resource not
  # accessible by integration" pointing at the workflow-runs API, which reads like a code
  # problem rather than a missing permission.
  actions: read

jobs:
  analyze:
    name: Analyze C#
    # Only run where code scanning can actually work, which is the public repository.
    #
    # This file lives in both repos, because the public tree is copied from the private one.
    # GitHub code scanning is free on public repositories and requires paid Advanced Security
    # on private ones, which this account does not have: enabling it returns
    # "403 Code scanning is not enabled for this repository". So on the private repo the
    # analysis ran perfectly, scanned all 25 C# files, exported SARIF, and then failed on
    # upload every single time since at least 2026-08-15, sending a failure notification on
    # every push for something that could never succeed.
    #
    # Skipping is the honest outcome rather than deleting the workflow: the public repo holds
    # identical code and its CodeQL run passes, so the code IS scanned. If this repo ever goes
    # public, or Advanced Security is ever bought, delete this condition and it resumes.
    if: github.repository == 'CourageToChange/LocalPhotoPDF'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Restore locked dependencies
        run: dotnet restore .\LocalPhotoPDF.sln --locked-mode --runtime win-x64

      - name: Build for analysis
        run: dotnet build .\LocalPhotoPDF.sln --configuration Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:csharp
